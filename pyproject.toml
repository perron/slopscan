[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopscan"
version = "0.1.0"
description = "Detect common AI writing tells and generic AI-looking UI patterns in text or HTML/CSS."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slopscan = "slopscan.cli:main"

[tool.setuptools.packages.find]
include = ["slopscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
