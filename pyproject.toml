[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopscan"
version = "0.1.1"
description = "Detect common AI writing tells and generic AI-looking UI patterns in text or HTML/CSS."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "cli", "writing", "linter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/slopscan"
Repository = "https://github.com/perron/slopscan"
Issues = "https://github.com/perron/slopscan/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slopscan = "slopscan.cli:main"

[tool.setuptools.packages.find]
include = ["slopscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
